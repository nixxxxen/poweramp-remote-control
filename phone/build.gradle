plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.powerampremote.phone'
    compileSdk 36

    defaultConfig {
        // Legacy ID retained so upgrades keep the verified server identity and Bearer token.
        applicationId 'dev.r4remote.poweramp.phone'
        minSdk 26
        targetSdk 36
        // The legacy 0.7.0 phone APK already shipped code 7; keep upgrades monotonic.
        versionCode 12
        versionName '0.4.1'

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = false
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.4'
    // 1.10.1 is the current stable release; lint flattens the 1.11.0 RC metadata.
    //noinspection GradleDependency
    implementation 'androidx.media3:media3-common:1.10.1'
    //noinspection GradleDependency
    implementation 'androidx.media3:media3-session:1.10.1'
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}
