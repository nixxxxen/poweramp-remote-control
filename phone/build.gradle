plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.powerampremote.phone'
    compileSdk 36

    defaultConfig {
        // Legacy ID retained so upgrades keep the verified server identity and Bearer token.
        applicationId 'dev.r4remote.poweramp.phone'
        minSdk 26
        targetSdk 36
        // The legacy 0.7.0 phone APK already shipped code 7; keep upgrades monotonic.
        versionCode 8
        versionName '0.2.0'

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}
